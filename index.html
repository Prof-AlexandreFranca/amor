<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Você é assim...</title>
    <style>
        body {
            /* Dica: Eles mudam a imagem aqui */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://picsum.photos/1920/1080') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        #lacuna { color: #00ff88; text-decoration: underline; }
        .botoes { margin-top: 20px; }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-gerar { background-color: #00ff88; color: black; }
        .btn-limpar { background-color: #ff4757; color: white; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <h1>Sirene você é <span id="lacuna">_________</span></h1>

    <div class="botoes">
        <button class="btn-gerar" onclick="gerarVibe()">Descubra</button>
        <button class="btn-limpar" onclick="limparVibe()">Resetar</button>
    </div>

    <script>
        // Onde a mágica acontece: eles inventam as frases aqui!
        const frases = [
            "o AMOR da minha VIDA! 💕",
            "Minha parceira de vida e melhor amiga! 🤝❤️",
            "A mulher mais linda e incrível desse mundo! ✨👸",
            "Dona do meu coração e do meu pensamento! 🔐💖",
            "Rainha e mãe maravilhosa 👑",
            "A maior bênção que Deus me deu! 🎨💍",
            "a escada da minha subida 🪜​",
            "a espera na Janela 🪟​",
            "a tradução do que é o Amor 😘​"
        ];

        function gerarVibe() {
    const indiceAleatorio = Math.floor(Math.random() * frases.length);

    document.getElementById("lacuna").innerText =
        frases[indiceAleatorio];

    const musica = document.getElementById("musica");

    if (musica.paused) {
        musica.play();
    }
        }

        function limparVibe() {
            document.getElementById('lacuna').innerText = "_________";
        }
    </script>
</body>
</html>
